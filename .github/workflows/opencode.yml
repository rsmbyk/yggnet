name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  opencode:
    # Anchored trigger: bare '/oc' would fire on '/octave', code blocks, etc.
    # Match the command at start-of-body or mid-body, followed by end-of-body
    # or a space. (GitHub expression literals do not interpret `\n`, so
    # newline-anchored matching is impossible; `contains(body, '/oc ')` also
    # matches after real newlines.) Ignore bot actors to avoid reply loops,
    # and require OWNER/MEMBER/COLLABORATOR so any commenter on this public
    # repo cannot start secret-bearing runs.
    if: |
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'opencode-agent' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        github.event.comment.body == '/oc' ||
        contains(github.event.comment.body, '/oc ') ||
        endsWith(github.event.comment.body, '/oc') ||
        github.event.comment.body == '/opencode' ||
        contains(github.event.comment.body, '/opencode ') ||
        endsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC-minted GitHub App installation token (via OPENCODE_API_KEY exchange)
      # handles checkout + commenting/pushing. Proven by opencode-review posting
      # successfully on PR #19 with this mode.
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Free Zen model (limited-time offer). Requires only OPENCODE_API_KEY.
          # Swap to a paid verified model when ready, e.g.:
          #   model: anthropic/claude-sonnet-4-5  (plus ANTHROPIC_API_KEY in env)
          #   model: opencode/gpt-5.5
          #   model: opencode/claude-sonnet-4-5
          model: opencode/muse-spark-1.3-contributor-free
          prompt: |
            You are working in Yggnet (SvelteKit + Threlte + TypeScript). The triggering
            comment containing `/oc` or `/opencode` is the task. Execute it.

            Mandatory project rules (see AGENTS.md):
            - Read AGENTS.md, docs/vision.md, relevant docs/adr/*, and the active
              specs/NNN-slug/{plan,spec,tasks}.md before coding.
            - Do NOT invent scope. Follow spec acceptance criteria and tasks only.
            - Git Flow: feature branches from `develop` as `feat/NNN-slug`
              (hotfixes from `main`); PR target is `develop` unless release/hotfix.
              Never push directly to `main` or `develop`.
            - TDD for behavior. Keep `src/lib/graph/**` at >=90% lines/branches/
              functions/statements (`npm run test:coverage`). Playwright
              (`npm run test:e2e`) for user-visible flows. `npm run lint`,
              `npm run check`, and `npm run build` must pass (see .github/workflows/ci.yml).
            - Architecture: `src/lib/graph/**` must NOT import svelte, `$app/*`,
              `three`, or `@threlte/*`. UI/world call the graph public API
              (`$lib/graph`). Algorithms run via AlgorithmRunner on serializable
              snapshots. World/camera numerics live in src/lib/world/world-config.ts
              (see docs/world-scale.md).
            - In the same PR as a status change, update backlog/board.md plus the
              ITEM frontmatter.
            - Conventional Commits. Agent commits end with:
              Co-authored-by: Cursor <cursoragent@cursor.com>
            - Use roles ("project owner", "reviewer"), never personal names.
            - Never commit secrets. Never force-push protected branches.

            Behavior:
            - For code changes: create a branch, implement, run the checks above,
              and open a PR against `develop` with tests and SPEC references.
              (The checkout uses persist-credentials:false; push via your minted
              App installation token.)
            - For questions/triage: reply in the thread with findings and docs links.
