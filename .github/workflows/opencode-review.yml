name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets under `pull_request` (not `pull_request_target`),
    # so the review job would red-X. Skip forks; document as unsupported.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC-minted GitHub App installation token (via OPENCODE_API_KEY exchange)
      # handles commenting. Proven by this job posting successfully on PR #19.
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Keep in sync with opencode.yml. Free Zen default; swap to paid when ready.
          model: opencode/muse-spark-1.3-contributor-free
          prompt: |
            Review this pull request for Yggnet (SvelteKit + Threlte + TypeScript).
            Read-only: comment findings, do not push commits.

            Check against:
            - AGENTS.md + docs/vision.md + relevant docs/adr/* + linked spec pack
              (specs/NNN-slug/{plan,spec,tasks}.md). Flag scope invented
              beyond spec acceptance criteria.
            - Correctness, edge cases, potential bugs.
            - TDD evidence: unit tests for behavior, `src/lib/graph/**` coverage
              >=90%, Playwright coverage for user-visible flows.
            - Architecture: `src/lib/graph/**` must NOT import svelte, `$app/*`,
              `three`, or `@threlte/*`. Graph access via `$lib/graph` public API.
              AlgorithmRunner + serializable snapshots. World/camera numerics from
              src/lib/world/world-config.ts (docs/world-scale.md).
            - CI gates will run lint / typecheck / coverage / build / e2e; call out
              likely failures (unused CSS/selectors, a11y warnings, adapter misuse).
            - Process: Git Flow base (`develop` unless hotfix/release), Conventional
              Commits with `Co-authored-by: Cursor <cursoragent@cursor.com>` trailer
              on agent commits, backlog/board.md + ITEM frontmatter updated on status
              changes, no personal names (roles only), no secrets, no force-push.

            Output: concise findings grouped as Must-fix / Should-fix / Nit, with
            file:line references. If the PR is clean, say so explicitly.
